name: Build Reversense platform

# triggers { vcs { triggerRules = "+:**"; branchFilter = "" } }
on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      uiplugins:
        description: 'UIs to setup using the format "dexcalibur-home@latest,dxc-ui-reverse@latest"'
        required: false
        type: string

concurrency:
  group: build-dxc-pro-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # requis pour l'upload d'asset sur une release

env:
  DXC_RELEASE_ID: "1.8.0"
  GH_WORKFLOW: 1

jobs:
  # ---------------------------------------------------------------------------
  # script { name = "Detect node version" }
  # Job séparé : la valeur alimente `container.image` du job suivant, or les
  # expressions dans `container:` ne peuvent référencer que des outputs de jobs
  # (`needs.*`), jamais des outputs de steps du même job.
  # ---------------------------------------------------------------------------
  detect-node-version:
    name: Detect node version
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.nvmrc.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: nvmrc
        run: |
          echo "version=$(cat .nvmrc | cut -b2-)" >> "$GITHUB_OUTPUT"

  build:
    name: Build core for various runner
    needs: detect-node-version
    runs-on: ubuntu-latest
    container:
      image: node:${{ needs.detect-node-version.outputs.node_version }}-slim
    steps:
      - name: Install git (checkout prerequisite)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python-is-python3  curl git ca-certificates
          python -v
          rm -rf /var/lib/apt/lists/*
          mkdir code

      - uses: actions/checkout@v4
        with:
          path: ./code

      - name: Install dependencies
        run: |
          cp -r ./code ./base
          cd ./base
          npm install

      - name: Build code
        run: |
          mkdir ./dist/agent
          mkdir ../out
          cp -r ./scripts/ ./dist/scripts
          cp -r ./node_modules/ ./dist/node_modules
          cp -r ./package.json ./dist/package.json
          cp -r ./info.json ./dist/info.json
          cp -r ./3TH_LICENSES.md ./dist/3TH_LICENSES.md
          cp -r ./LICENSE ./dist/LICENSE
          cp -r ./dexcalibur ./dist/dexcalibur
          cp -r ./README.md ./dist/README.md
          cp -r ./src/requires ./dist/src/requires
          cp -r ./assets ./dist/assets
          npm prune --omit=dev
          echo "latest" > frida_version
          tar -czvf ../out/dxc-server-linux.node.tar.gz dist
          rm -r ./dist
          tar -czvf ../out/dxc-server-linux.deno.tar.gz .

      - run: |
          ls -la .
          ls -la ../out

      - name: Test
        if: false
        run: npm test

      - name: Publish Deno artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxc-server-linux-deno
          path: ./out/dxc-server-linux.deno.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish Node artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxc-server-linux-node
          path: ./out/dxc-server-linux.node.tar.gz
          if-no-files-found: error
          retention-days: 30

  static-analysis:
    name: Static Analysis
    needs: build
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2025.1
        with:
          args: "--linter,jetbrains/qodana-js:latest,--profile-name,qodana.recommended"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

