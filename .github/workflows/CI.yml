name: Build Reversense platform

# triggers { vcs { triggerRules = "+:**"; branchFilter = "" } }
on:
  release:
    types: ['released']
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build'
        required: false
        type: string
      static_analysis:
        description: 'Perform static analysis'
        required: false
        type: boolean
        default: false
      skip_test:
        description: 'Skip tests'
        required: false
        type: boolean
        default: false
      skip_docker:
        description: 'Skip Docker build'
        required: false
        type: boolean
        default: true
      skip_upload:
        description: 'Skip upload'
        required: false
        type: boolean
        default: true
      skip_registry_publish:
        description: 'Skip publishing to registries'
        required: false
        type: boolean
        default: true
      proui_version:
        description: 'Pro UI version to use. Lets empty to use the latest. Default: 1.8.0'
        required: false
        type: string
        default: '1.8.0'
      homeui_version:
        description: 'Home UI version to use. Lets empty to use the latest. Default: 15.13.7'
        required: false
        type: string
        default: '15.13.7'
      agent_version:
        description: 'Dexcalibur SDK (agent) version to use. Lets empty to use the latest. Default: 1.3.4'
        required: false
        type: string
        default: '1.3.4'

concurrency:
  group: build-dxc-pro-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
  DXC_RELEASE_ID: "1.8.0"
  GH_WORKFLOW: 1

jobs:
  detect-node-version:
    name: Detect node version
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.nvmrc.outputs.version }}
      node_version_major: ${{ steps.nvmrc.outputs.version_major }}
    steps:
      - uses: actions/checkout@v4
      - id: nvmrc
        run: |
          version=$(tr -d ' \t\r\n' < .nvmrc)
          version=${version#v}
          case "$version" in
          [0-9]*) ;;
          *) echo "::error::.nvmrc is not a pinned version: $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_major=${version%%.*}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    if: inputs.skip_test != true
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  static-analysis:
    name: Static Analysis
    needs: test
    if: ${{ inputs.static_analysis }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2025.1
        with:
          args: "--linter,jetbrains/qodana-js:latest,--profile-name,qodana.recommended"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  build:
    name: Build core for various runners
    needs: [detect-node-version]
    strategy:
      matrix:
        os: [ubuntu-latest]
        node:
          - ${{ needs.detect-node-version.outputs.node_version_major }}
    runs-on: ${{ matrix.os }}
    steps:
     - name: Install git (checkout prerequisite)
       run: mkdir code
     - uses: actions/checkout@v4
       with:
          path: ./code
     - name: Install de dependencies
       run: |
        cp -r ./code ./base
        cd ./base
        npm install
     - name: Build code
       run: |
        cd ./base
        mkdir -p ./dist/agent
        mkdir ../out
        ls -la .
        cp -r ./scripts/ ./dist/scripts
        cp -r ./node_modules/ ./dist/node_modules
        cp -r ./package.json ./dist/package.json
        cp -r ./info.json ./dist/info.json
        cp -r ./3TH_LICENSES.md ./dist/3TH_LICENSES.md
        cp -r ./LICENSE ./dist/LICENSE
        cp -r ./dexcalibur ./dist/dexcalibur
        cp -r ./README.md ./dist/README.md
        cp -r ./src/requires ./dist/src/requires
        cp -r ./assets ./dist/assets
        npm prune --omit=dev
        echo "latest" > frida_version
        tar -czvf ../out/dxc-server-${{ matrix.os }}.node.tar.gz dist
        tar -czvf ../out/dxc-server-${{ matrix.os }}.deno.tar.gz --exclude='dist' .

     - name: Publish Deno artifact
       uses: actions/upload-artifact@v4
       with:
        name: dxc-server-${{ matrix.os }}-deno.tar.gz
        path: ./out/dxc-server-${{ matrix.os }}.deno.tar.gz
        compression-level: 0
        if-no-files-found: error
        retention-days: 10

     - name: Publish Node artifact
       uses: actions/upload-artifact@v4
       with:
         name: dxc-server-${{ matrix.os }}-node.tar.gz
         path: ./out/dxc-server-${{ matrix.os }}.node.tar.gz
         compression-level: 0
         if-no-files-found: error
         retention-days: 10

     - name: Install reversense agent
       if: success() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
       run: |
         cd ./base
         mkdir -p ./_agent
         gh release download ${{ inputs.agent_version || '' }} \
           --repo reversenseorg/dexcalibur-agent \
           --pattern 'dxc-agent-dist-${{ inputs.agent_version || 'latest' }}.tar.gz' \
           --dir ./_agent
         tar -xzvf ./_agent/dxc-agent-dist-${{ inputs.agent_version || 'latest' }}.tar.gz -C ./_agent
         echo "./_agent/"
         ls -la ./_agent/
         cp -r ./_agent/ ./agent
         cp -r ./_agent/ ./dist/agent
       env:
         GH_TOKEN: ${{ github.token }}

     - name: Install dxc-ui-reverse UI
       if: success() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
       run: |
         cd ./base
         mkdir -p ./_uis
         gh release download ${{ inputs.proui_version || '' }}  \
           --repo reversenseorg/dxc-ui-reverse \
           --pattern 'dxc-pro-dist-${{ inputs.proui_version || '' }}.tar.gz' \
           --dir ./_uis
         mkdir -p ./_uis/pro
         tar -xzvf ./_uis/dxc-pro-dist-${{ inputs.proui_version || '' }}.tar.gz -C ./_uis/pro
         echo "create links:"
         mkdir ./src/webserver/www ./dist/src/webserver/www
         cp -r ./_uis/pro/dist/dxc-ui-reverse ./src/webserver/www/pro
         cp -r ./_uis/pro/dist/dxc-ui-reverse ./dist/src/webserver/www/pro
         rm -r ./_uis/pro/dist/dxc-ui-reverse
       env:
         GH_TOKEN: ${{ github.token }}
         RS_UI_VERSION: ${{ inputs.proui_version || '' }}

     - name: Install dexcalibur-home UI
       if: success() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
       run: |
         cd ./base
         gh release download ${{ inputs.homeui_version || '' }} \
           --repo reversenseorg/dexcalibur-home \
           --pattern 'dxc-home-dist-${{ inputs.homeui_version || '' }}.tar.gz' \
           --dir ./_uis
         mkdir -p ./_uis/home
         tar -xzvf ./_uis/dxc-home-dist-${{ inputs.homeui_version || '' }}.tar.gz -C ./_uis/home
         echo "./_uis/home/ content:"
         cp -r ./_uis/home/dist/dexcalibur-home ./src/webserver/www/home
         cp -r ./_uis/home/dist/dexcalibur-home ./dist/src/webserver/www/home
         rm -r ./_uis/home/dist/dexcalibur-home
       env:
         GH_TOKEN: ${{ github.token }}
         RS_UI_VERSION: ${{ inputs.homeui_version || '' }}

     - name: Prepare packaging
       run: |
         cd ./base
         tar -czf ../out/dxc-platform-${{ matrix.os }}.deno.tar.gz --dereference --anchored --exclude='dist' --exclude='_*' .
         cd ./dist
         tar -czf ../../out/dxc-platform-${{ matrix.os }}.node.tar.gz --anchored --exclude='_*' --dereference .

     - name: Publish Platform Node artifact
       uses: actions/upload-artifact@v4
       with:
         name: dxc-platform-${{ matrix.os }}.node.tar.gz
         path: ./out/dxc-platform-${{ matrix.os }}.node.tar.gz
         compression-level: 0
         if-no-files-found: error
         retention-days: 10

     - name: Publish Platform Deno artifact
       uses: actions/upload-artifact@v4
       with:
         name: dxc-platform-${{ matrix.os }}.deno.tar.gz
         path: ./out/dxc-platform-${{ matrix.os }}.deno.tar.gz
         compression-level: 0
         if-no-files-found: error
         retention-days: 10

  release_upload:
    name: Publish release assets
    needs: build
    if: success() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && inputs.skip_upload != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: tarballs, path: out/ }

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          gh release upload "$TAG" ./out/dxc-*-ubuntu-latest.tar.gz --clobber

  docker:
    name: Build Docker image
    needs: build
    if: success() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && inputs.skip_docker != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # uniquement si multi-arch
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./base
          file: ./base/docker/linux_x64/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        if: false
        with:
          context: ./base
          file: ./base/docker/linux_x64/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  publish_gh:
    name: Publish to GitHub NPM registry
    if: false && github.event_name == 'release' && inputs.skip_registry_publish != true
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: tarballs, path: out/ }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.build.outputs.node_version }}
      - id: github-publish
        name: Publish to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f ~/.npmrc
          echo '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}' > ~/.npmrc
          npm publish ./out/reversenseorg-dexcalibur-agent-${TAG#v}.tgz --registry=https://npm.pkg.github.com/

  publish_npmjs:
    name: Publish to NPMjs registry
    if: false && github.event_name == 'release' && inputs.skip_registry_publish != true
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: tarballs, path: out/ }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.build.outputs.node_version }}
      - name: npm >= 11.5.1
        run: |
          npm install -g npm@latest
          npm --version
      - id: npmjs-publish
        name: Publish to npmjs.org
        run: |
          npm publish ./out/reversense-dexcalibur-agent-${TAG#v}.tgz --registry=https://registry.npmjs.org/ \
            --access public \
            --loglevel=verbose 2>&1

  notify-discord:
    name: Discord notification
    needs: [build,publish_gh,publish_npmjs,release_upload]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          NPMJS_RESULT: ${{ needs.publish_gh.result }}
          GH_RESULT: ${{ needs.publish_gh.result }}
          REL_UPLOAD: ${{ needs.release_upload.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          
          echo "Build result: $BUILD_RESULT"
          echo "NPMJS result: $NPMJS_RESULT"
          echo "GH result: $GH_RESULT"
          echo "Release upload result: $REL_UPLOAD"
          
          if [[ "$GH_RESULT" == "success" || "$NPMJS_RESULT" == "success" || "$REL_UPLOAD" == "success" ]]; then
            STATUS="SUCCESS"; COLOR=$(( 16#2EA043 ))
          elif [[ "$BUILD_RESULT" == "cancelled" || "$NPMJS_RESULT" == "cancelled" || "$GH_RESULT" == "cancelled" ]]; then
            STATUS="CANCELLED"; COLOR=$(( 16#6E7681 ))
          else
            STATUS="FAILED"; COLOR=$(( 16#D73A49 ))
          fi
          
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          jq -n \
            --arg title   "Agent:build - ${GITHUB_WORKFLOW} — ${STATUS}" \
            --arg url     "$RUN_URL" \
            --arg branch  "$GITHUB_REF_NAME" \
            --arg sha     "${GITHUB_SHA:0:8}" \
            --arg actor   "$GITHUB_ACTOR" \
            --arg msg     "$(printf '%.200s' "$COMMIT_MSG")" \
            --argjson color "$COLOR" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                description: $msg,
                fields: [
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Commit",  value: $sha,    inline: true},
                  {name: "Author",  value: $actor,  inline: true}
                ],
                timestamp: (now | todate)
              }],
              allowed_mentions: {parse: []}
            }' > payload.json
          
          curl -sS --fail-with-body \
               --retry 5 --retry-delay 2 --retry-all-errors \
               -X POST \
               -H "Content-Type: application/json" \
               -d @payload.json \
               "$DISCORD_WEBHOOK_URL"


